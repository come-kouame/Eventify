image: maven:3-eclipse-temurin-21-alpine

stages:
  - test
  - deploy

sonarqube:
  stage: test
  image: maven:3-eclipse-temurin-21-alpine
  variables:
    GIT_DEPTH: 0
  before_script:
    - chmod +x ci/setup-mvn-proxy.sh
    - ./ci/setup-mvn-proxy.sh
  script:
    - cd eventify-api
    - mvn verify sonar:sonar
      -Dsonar.host.url=https://sonar.info.univ-lyon1.fr
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

deploy:
  stage: deploy
  only:
    - main
  before_script:
    - chmod +x ci/setup-mvn-proxy.sh
    - ./ci/setup-mvn-proxy.sh
    - chmod 400 $CI_SSH_KEY
    - apk add openssh-client
  script:
    - cd eventify-api || (echo "Le dossier eventify-api n'existe pas." && exit 1)
    - mvn clean package
    - scp -o StrictHostKeyChecking=no -i $CI_SSH_KEY ./target/*.war gitlabci@192.168.75.28:/opt/tomcat/webapps/eventify.war
    - cd ..