spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventify_db
    username: eventify_user
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api/eventify
  forward-headers-strategy: framework