spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventify_db
    username: eventify_user
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
session:
  cookie:
    path: /eventify
    http-only: true
    secure: false
    same-site: lax